<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><meta name="description" content="超市商品临期与库存管理系统"><title>超市临期管家</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="topbar"><div><div class="eyebrow">SUPERMARKET STOCK MANAGER</div><h1>🛒 临期管家</h1></div><button id="notifyBtn" class="secondary">🔔 开启提醒</button></header>
<main class="container">
<section class="hero"><div><h2>一眼找到最需要处理的商品</h2><p>默认规则：距离过期 <strong id="thresholdText">45 天</strong>以内自动进入临期清单。</p></div><div class="today">今天<br><strong id="today"></strong></div></section>
<section class="stats"><div class="stat"><span>全部商品</span><b id="total">0</b></div><div class="stat warning"><span>临期商品</span><b id="expiring">0</b></div><div class="stat danger"><span>15天内到期</span><b id="urgent">0</b></div><div class="stat expired"><span>已过期</span><b id="expired">0</b></div></section>
<section class="panel"><div class="panel-head"><div><h2>商品库存</h2><p>数据自动保存在本机浏览器。</p></div><div class="head-actions"><button id="importBtn" class="secondary">导入 CSV</button><button id="exportBtn" class="secondary">导出 CSV</button><button id="demoBtn" class="secondary">示例数据</button><button id="addBtn" class="primary">＋ 添加商品</button><input id="fileInput" type="file" accept=".csv,text/csv" hidden></div></div>
<div class="toolbar"><input id="search" placeholder="搜索商品、条码、货架位置…"><select id="filter"><option value="all">全部状态</option><option value="expiring">临期（45天内）</option><option value="urgent">15天内</option><option value="expired">已过期</option><option value="normal">正常</option></select><select id="sort"><option value="expiry">按过期日期</option><option value="name">按名称</option><option value="quantity">按数量</option></select></div>
<div class="table-wrap"><table><thead><tr><th>商品</th><th>类别</th><th>数量</th><th>过期日期</th><th>剩余</th><th>状态</th><th>操作</th></tr></thead><tbody id="productRows"></tbody></table><div id="empty" class="empty">没有符合条件的商品。</div></div></section>
<section class="settings panel"><div><h2>提醒设置</h2><p>可以把临期阈值改成 30、60 天等。当前设置保存在本机。</p></div><label class="threshold">临期阈值（天）<input id="threshold" type="number" min="1" max="365" value="45"><button id="saveSettings" class="primary">保存</button></label></section>
</main>
<dialog id="productDialog"><form method="dialog" id="productForm"><div class="dialog-head"><h2 id="dialogTitle">添加商品</h2><button type="button" id="closeDialog" class="icon">×</button></div><input type="hidden" id="productId"><label>商品名称<input id="name" required maxlength="80" placeholder="例如：鲜牛奶 1L"></label><div class="grid2"><label>类别<input id="category" maxlength="40" placeholder="乳制品"></label><label>条码 / SKU<input id="sku" maxlength="40" placeholder="可选"></label></div><div class="grid2"><label>数量<input id="quantity" type="number" min="0" step="1" value="1" required></label><label>过期日期<input id="expiry" type="date" required></label></div><div class="grid2"><label>货架位置<input id="location" maxlength="40" placeholder="A-03"></label><label>备注<input id="note" maxlength="120" placeholder="可选"></label></div><div class="form-actions"><button type="button" id="cancelBtn" class="secondary">取消</button><button class="primary" value="default">保存商品</button></div></form></dialog>
<div id="toast" class="toast"></div><script src="app.js"></script></body></html>
